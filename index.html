<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>X-POS | Logistics Cloud Terminal</title>
    <!-- Jalur Desain Ganda Anti Gagal Memuat -->
    <link rel="stylesheet" href="https://jsdelivr.net">
    <script src="https://tailwindcss.com"></script>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
            background-color: #f8fafc;
            margin: 0;
            padding: 0;
        }
        .sidebar-container {
            background-color: #ffffff;
            min-height: 100vh;
            padding: 1.5rem;
            position: fixed;
            top: 0;
            left: 0;
            width: 260px;
            z-index: 1000;
            border-right: 1px solid #edf2f7;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .main-content {
            margin-left: 260px;
            padding: 2rem;
            min-height: 100vh;
            width: calc(100% - 260px);
        }
        .search-card {
            background-color: #ffffff;
            border: 1px solid #edf2f7;
            border-radius: 1.25rem;
            padding: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.01), 0 2px 4px -1px rgba(0, 0, 0, 0.01);
        }
        .form-control-custom {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 0.75rem;
            padding: 0.625rem 1rem;
            font-size: 0.75rem;
            font-weight: 600;
            color: #334155;
            height: auto;
            width: 100%;
            transition: all 0.2s;
        }
        .form-control-custom:focus {
            outline: none;
            background-color: #fff;
            border-color: #0f172a;
            box-shadow: 0 0 0 4px rgba(15, 23, 42, 0.05);
        }
        .btn-query {
            background-color: #0f172a;
            color: #ffffff;
            font-weight: 700;
            font-size: 0.75rem;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .btn-query:hover { background-color: #1e293b; color: #fff; }
        .btn-reset {
            background-color: transparent;
            color: #64748b;
            font-weight: 700;
            font-size: 0.75rem;
            padding: 0.75rem 1.25rem;
            border-radius: 0.75rem;
            border: 1px solid #e2e8f0;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-reset:hover { background-color: #f8fafc; color: #0f172a; }
        .output-container {
            background-color: #ffffff;
            border: 1px dashed #e2e8f0;
            border-radius: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 440px;
            padding: 1.5rem;
            text-align: center;
            width: 100%;
            height: 100%;
        }
        .page-section { display: none; }
        .page-section.active { display: block; }
        .nav-link-custom {
            color: #475569;
            font-weight: 600;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            text-decoration: none;
            border-radius: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .nav-link-custom:hover, .nav-item.active .nav-link-custom {
            color: #0f172a;
            background-color: #f8fafc;
            font-weight: 700;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <!-- 1. SIDEBAR KIRI FIXED -->
    <div class="sidebar-container">
        <div>
            <!-- LOGO BRAND -->
            <div class="d-flex align-items-center" style="gap: 0.75rem; margin-bottom: 2rem; padding-left: 0.5rem;">
                <div style="background-color: #0f172a; color: #fff; font-weight: 800; padding: 0.375rem 0.75rem; border-radius: 0.5rem; font-size: 1.125rem; tracking-content: 0.05em;">XP</div>
                <div class="d-flex flex-column" style="line-height: 1;">
                    <span style="color: #0f172a; font-weight: 700; font-size: 0.875rem;">X-POS</span>
                    <span style="color: #94a3b8; font-weight: 600; font-size: 0.625rem; letter-spacing: 0.05em; text-transform: uppercase; margin-top: 0.125rem;">LOGISTICS</span>
                </div>
            </div>

            <!-- MENU ITEM LINKS -->
            <div class="nav-item active" id="menu-master" style="margin-bottom: 0.25rem;">
                <a onclick="switchPage('master')" class="nav-link-custom"><i class="fa-solid fa-layer-group" style="width: 1.25rem; text-align: center;"></i>Part Master</a>
            </div>
            <div class="nav-item" id="menu-order" style="margin-bottom: 0.25rem;">
                <a onclick="switchPage('order')" class="nav-link-custom"><i class="fa-solid fa-cart-shopping" style="width: 1.25rem; text-align: center;"></i>Part Order</a>
            </div>
            <div class="nav-item" id="menu-inquiry" style="margin-bottom: 0.25rem;">
                <a onclick="switchPage('inquiry')" class="nav-link-custom"><i class="fa-solid fa-magnifying-glass" style="width: 1.25rem; text-align: center;"></i>Part Inquiry</a>
            </div>
            <div class="nav-item" id="menu-claim" style="margin-bottom: 0.25rem;">
                <a onclick="switchPage('claim')" class="nav-link-custom"><i class="fa-solid fa-triangle-exclamation" style="width: 1.25rem; text-align: center;"></i>Part Claim</a>
            </div>
            <div class="nav-item" id="menu-claim-inq" style="margin-bottom: 0.25rem;">
                <a onclick="switchPage('claim-inq')" class="nav-link-custom"><i class="fa-solid fa-folder-open" style="width: 1.25rem; text-align: center;"></i>Claim Inquiry</a>
            </div>
        </div>

        <!-- PROFILE POJOK BAWAH -->
        <div style="border-top: 1px solid #edf2f7; padding-top: 1rem;">
            <div class="d-flex align-items-center" style="gap: 0.75rem; margin-bottom: 0.75rem;">
                <div style="width: 2.5rem; height: 2.5rem; background-color: #f1f5f9; border-radius: 0.75rem; display: flex; align-items: center; justify-content: center; color: #64748b; font-weight: bold;"><i class="fa-solid fa-user"></i></div>
                <div class="d-flex flex-column" style="line-height: 1.2;">
                    <span style="color: #0f172a; font-weight: 700; font-size: 0.75rem;">XPENG SUNTER</span>
                    <span style="color: #94a3b8; font-weight: 500; font-size: 0.625rem;">AF00115</span>
                </div>
            </div>
            <a href="#" style="color: #ef4444; font-weight: 700; font-size: 0.6875rem; text-decoration: none; display: flex; align-items: center; gap: 0.5rem; padding-left: 0.25rem;"><i class="fa-solid fa-right-from-bracket"></i> Sign Out</a>
        </div>
    </div>

    <!-- 2. MAIN CONTENT HUB SISI KANAN -->
    <div class="main-content">
        
        <!-- SECTION: PART MASTER -->
        <div id="page-master" class="page-section active">
            <div style="margin-bottom: 2rem;">
                <h1 style="font-size: 1.5rem; font-weight: 800; color: #0f172a; margin: 0; tracking: -0.025em;">MASTER</h1>
                <div style="font-size: 0.6875rem; color: #94a3b8; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 0.25rem; display: flex; align-items: center; gap: 0.5rem;">
                    <span style="width: 0.5rem; height: 0.5rem; border-radius: 50%; background-color: #10b981; display: inline-block;"></span> TERMINAL: AF00115
                </div>
            </div>

            <!-- CARD GRID SYSTEM BANNER -->
            <div class="search-card">
                <div class="row">
                    <!-- INPUT FIELD CONTAINER -->
                    <div class="col-lg-5 border-right" style="padding-right: 2rem;">
                        <div style="color: #0f172a; font-weight: 800; font-size: 0.75rem; letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 0.25rem;">
                            <span style="background-color: #0f172a; color: #fff; font-size: 0.625rem; padding: 0.125rem 0.375rem; border-radius: 0.25rem; margin-right: 0.25rem;">#</span> Inventory Search
                        </div>
                        <p style="color: #94a3b8; font-weight: 500; font-size: 0.75rem; margin-bottom: 1.5rem;">Input specific part numbers to check current stock availability.</p>

                        <!-- GRID FIELD INPUT 10 SEKAT -->
                        <div class="row" style="margin-left: -5px; margin-right: -5px;">
                            <div class="col-6" style="padding: 0 5px; margin-bottom: 0.75rem;"><input type="text" class="part-input form-control-custom" placeholder="1  Part Number"></div>
                            <div class="col-6" style="padding: 0 5px; margin-bottom: 0.75rem;"><input type="text" class="part-input form-control-custom" placeholder="2  Part Number"></div>
                            <div class="col-6" style="padding: 0 5px; margin-bottom: 0.75rem;"><input type="text" class="part-input form-control-custom" placeholder="3  Part Number"></div>
