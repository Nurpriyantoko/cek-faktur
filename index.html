<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-POS | Logistics Cloud Terminal Bypass</title>
    <style>
        html, body, iframe { margin: 0; padding: 0; height: 100%; width: 100%; border: none; overflow: hidden; }
    </style>
</head>
<body>

    <!-- MENEMBAK LANGSUNG DASHBOARD UTAMA TANPA TERTANGKAP GEMBOK LOGIN -->
    <iframe src="https://ai.studio" id="xposFrame" allow="clipboard-read; clipboard-write"></iframe>

    <script src="https://cloudflare.com"></script>
    <script>
        const LINK_CSV_STOK = "https://google.com";

        // ENGINE BYPASS: Memaksa frame melompat langsung ke halaman utama Master Stock jika tertahan di halaman Sign In
        setInterval(() => {
            try {
                const frame = document.getElementById('xposFrame');
                if (frame && frame.contentWindow) {
                    const frameDoc = frame.contentWindow.document;
                    
                    // 1. Logika Mendeteksi dan Mengisi Form Login Otomatis Jika Terkunci Keamanan
                    const emailInput = frameDoc.querySelector('input[type="email"]');
                    const passwordInput = frameDoc.querySelector('input[type="password"]');
                    const signInBtn = frameDoc.querySelector('button');

                    if (emailInput && passwordInput && signInBtn && emailInput.value === "") {
                        emailInput.value = "admin@xpos.com";
                        passwordInput.value = "admin123";
                        
                        // Memicu trigger event React internal agar input terbaca sistem
                        emailInput.dispatchEvent(new Event('input', { bubbles: true }));
                        passwordInput.dispatchEvent(new Event('input', { bubbles: true }));
                        
                        setTimeout(() => { signInBtn.click(); }, 500);
                    }

                    // 2. Logika Menyambungkan Aksi Klik Tombol Query Stock ke Google Sheets Anda
                    let queryBtn = null;
                    frameDoc.querySelectorAll('button').forEach(btn => {
                        if (btn.innerText.toLowerCase().includes('query') && !btn.getAttribute('data-db-bound')) {
                            queryBtn = btn;
                        }
                    });

                    if (queryBtn) {
                        queryBtn.setAttribute('data-db-bound', 'true');
                        queryBtn.type = "button";
                        queryBtn.addEventListener('click', function(e) {
                            e.preventDefault();
                            e.stopPropagation();
                            executeLiveStockSystem(frameDoc);
                        }, true);
                    }
                }
            } catch (e) {
                // Mencegah crash jika cross-origin policy sedang melakukan handshake
            }
        }, 1000);

        function executeLiveStockSystem(frameDoc) {
            let searchedParts = [];
            frameDoc.querySelectorAll('input').forEach(inp => {
                let val = inp.value.trim();
                if (val && !val.toLowerCase().includes('search')) searchedParts.push(val);
            });

            if (searchedParts.length === 0) { alert('Silakan masukkan minimal satu Part Number terlebih dahulu!'); return; }

            let outputArea = null;
            frameDoc.querySelectorAll('div').forEach(d => {
                if (d.innerText.includes('AWAITING') || d.innerText.includes('RESULTS')) outputArea = d;
            });

            if (!outputArea) return;

            outputArea.innerHTML = `
                <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; min-height:350px; text-align:center; margin:auto;">
                    <i class="fas fa-circle-notch fa-spin mb-2" style="font-size:1.5rem; color:#0f172a;"></i>
                    <div style="color:#94a3b8; font-weight:700; font-size:0.65rem; tracking:0.05em; text-transform:uppercase;">LOADING QUERY LIVE STOCK...</div>
                </div>
            `;

            fetch(LINK_CSV_STOK)
            .then(res => res.text())
            .then(csvText => {
                const lines = csvText.split(/\r?\n/);
                let tableRowsHTML = "";
                let currentMonthContext = "Oct 2026";

                let idxPart = 0, idxName = 1, idxLoc = 2, idxCost = 5;
                let idxW1 = 6, idxW2 = 9, idxW3 = 12, idxW4 = 15;

                for (let rawPartNum of searchedParts) {
                    let ditemukan = false;
                    let cleanSearchInput = rawPartNum.replace(/[^a-zA-Z0-9]/g, "").trim().toLowerCase();

                    for (let i = 0; i < lines.length; i++) {
                        let baris = lines[i].trim();
                        if (!baris) continue;

                        if (baris.toLowerCase().includes("rekap september") || baris.toLowerCase().includes("sept 2026")) { currentMonthContext = "Sept 2026"; }
                        if (baris.toLowerCase().includes("rekap october") || baris.toLowerCase().includes("oct 2026")) { currentMonthContext = "Oct 2026"; }

                        let columns = baris.split('\t');
                        if (columns.length <= 1) {
                            columns = baris.split(/[;,-]/).map(col => col.replace(/^"(.*)"$/, '$1').trim());
                        }

                        if (columns.length > idxPart) {
                            let cleanSheetInput = columns[idxPart].replace(/[^a-zA-Z0-9]/g, "").trim().toLowerCase();
                            
                            if (cleanSheetInput === cleanSearchInput) {
                                ditemukan = true;
                                let partName = columns[idxName] || '-';
                                let lokasiRak = columns[idxLoc] || '-';
                                let costPerItem = columns[idxCost] || 'Rp 0';

                                let w1Val = columns[idxW1] || "";
                                let w2Val = columns[idxW2] || "";
                                let w3Val = columns[idxW3] || "";
                                let w4Val = columns[idxW4] || "";

                                let stokQty = 0; let weekInfo = "Week 1";
                                
                                if (w4Val !== "" && w4Val !== "-" && w4Val !== "0" && w4Val !== undefined) {
                                    stokQty = parseInt(w4Val) || 0; weekInfo = "Week 4";
                                } else if (w3Val !== "" && w3Val !== "-" && w3Val !== "0" && w3Val !== undefined) {
                                    stokQty = parseInt(w3Val) || 0; weekInfo = "Week 3";
                                } else if (w2Val !== "" && w2Val !== "-" && w2Val !== "0" && w2Val !== undefined) {
                                    stokQty = parseInt(w2Val) || 0; weekInfo = "Week 2";
                                } else {
                                    stokQty = parseInt(w1Val) || 0; weekInfo = "Week 1";
                                }

                                if (isNaN(stokQty)) stokQty = 0;
                                let badgeColor = stokQty > 0 ? "background-color: #ecfdf5; color: #047857;" : "background-color: #fff1f2; color: #e11d48;";
                                let badgeText = stokQty > 0 ? "AVAILABLE" : "EMPTY";

                                tableRowsHTML += `
                                    <tr style="border-bottom: 1px solid #f1f5f9;">
                                        <td style="padding: 1rem 0.5rem; text-align: left;"><strong style="color: #0f172a; font-size: 0.8rem; display: block;">${columns[idxPart]}</strong><span style="background-color: #f1f5f9; color: #64748b; font-weight: 700; font-size: 0.55rem; padding: 0.125rem 0.375rem; border-radius: 0.25rem; margin-top: 0.25rem; display: inline-block;">${currentMonthContext} (${weekInfo})</span></td>
                                        <td style="padding: 1rem 0.5rem; text-align: left;"><span style="color: #64748b; font-size: 0.75rem; display: block; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${partName}</span><span style="color: #2563eb; font-weight: 700; font-size: 0.65rem; display: block; margin-top: 0.25rem;">LOC: ${lokasiRak}</span></td>
                                        <td style="padding: 1rem 0.5rem; text-align: left; font-size: 0.75rem; font-weight: bold; color: #0f172a;">${costPerItem}</td>
                                        <td style="padding: 1rem 0.5rem; text-align: center; font-size: 0.85rem; font-weight: bold; color: #0f172a;">${stokQty}</td>
                                        <td style="padding: 1rem 0.5rem; text-align: right;"><span style="display: inline-block; font-weight: 800; font-size: 0.65rem; padding: 0.25rem 0.625rem; border-radius: 0.5rem; ${badgeColor}">${badgeText}</span></td>
                                    </tr>
                                `;
                                break;
                            }
                        }
                    }
                    if (!ditemukan) {
                        tableRowsHTML += `<tr><td style="padding: 1rem 0.5rem; text-align: left; font-weight: bold; color: #e11d48; font-size: 0.75rem;">${rawPartNum}</td><td colspan="4" style="padding: 1.5rem 0; text-align: center; font-style: italic; font-size: 0.75rem; color: #94a3b8;">Not Found / Suku Cadang Tidak Ditemukan</td></tr>`;
                    }
                }

                outputArea.innerHTML = `
