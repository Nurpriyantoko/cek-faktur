<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>X-POS | Logistics Cloud Terminal</title>
    <!-- Memuat CDN Resmi untuk Desain dan Ikon Aplikasi -->
    <script src="https://tailwindcss.com"></script>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
            background-color: #f8fafc;
        }
        input:focus {
            outline: none;
            border-color: #1e293b !important;
            box-shadow: 0 0 0 4px rgba(30, 41, 59, 0.05) !important;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }
        .page-section { display: none; }
        .page-section.active { display: block; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">

    <!-- 1. SIDEBAR KIRI PREMIUM (TATA LETAK ASLI KEMBALI NORMAL) -->
    <div class="fixed top-0 left-0 w-[260px] h-screen bg-white border-r border-slate-100 p-6 flex flex-col justify-between z-50 shadow-sm">
        <div>
            <!-- BRAND LOGO -->
            <div class="flex items-center gap-3 px-2 mb-8">
                <div class="bg-slate-900 text-white font-extrabold px-3 py-1.5 rounded-lg text-lg tracking-wider">XP</div>
                <div class="flex flex-col">
                    <span class="text-slate-900 font-bold text-sm tracking-tight leading-none">X-POS</span>
                    <span class="text-slate-400 font-semibold text-[10px] tracking-widest uppercase mt-0.5">LOGISTICS</span>
                </div>
            </div>

            <!-- MENU ITEM NAVIGATION -->
            <div class="space-y-1">
                <div class="nav-item active" id="menu-master">
                    <a onclick="switchPage('master')" class="flex items-center gap-3 px-4 py-3 text-slate-900 font-bold text-sm rounded-xl cursor-pointer bg-slate-50 transition-all no-underline">
                        <i class="fa-solid fa-layer-group text-base w-5 text-center text-slate-900"></i>Part Master
                    </a>
                </div>
                <div class="nav-item" id="menu-order">
                    <a onclick="switchPage('order')" class="flex items-center gap-3 px-4 py-3 text-slate-500 font-semibold text-sm rounded-xl cursor-pointer hover:bg-slate-50 hover:text-slate-900 transition-all no-underline">
                        <i class="fa-solid fa-cart-shopping text-base w-5 text-center"></i>Part Order
                    </a>
                </div>
                <div class="nav-item" id="menu-inquiry">
                    <a onclick="switchPage('inquiry')" class="flex items-center gap-3 px-4 py-3 text-slate-500 font-semibold text-sm rounded-xl cursor-pointer hover:bg-slate-50 hover:text-slate-900 transition-all no-underline">
                        <i class="fa-solid fa-magnifying-glass text-base w-5 text-center"></i>Part Inquiry
                    </a>
                </div>
                <div class="nav-item" id="menu-claim">
                    <a onclick="switchPage('claim')" class="flex items-center gap-3 px-4 py-3 text-slate-500 font-semibold text-sm rounded-xl cursor-pointer hover:bg-slate-50 hover:text-slate-900 transition-all no-underline">
                        <i class="fa-solid fa-triangle-exclamation text-base w-5 text-center"></i>Part Claim
                    </a>
                </div>
                <div class="nav-item" id="menu-claim-inq">
                    <a onclick="switchPage('claim-inq')" class="flex items-center gap-3 px-4 py-3 text-slate-500 font-semibold text-sm rounded-xl cursor-pointer hover:bg-slate-50 hover:text-slate-900 transition-all no-underline">
                        <i class="fa-solid fa-folder-open text-base w-5 text-center"></i>Claim Inquiry
                    </a>
                </div>
            </div>
        </div>

        <!-- PROFILE POJOK BAWAH -->
        <div class="border-t border-slate-100 pt-4 flex flex-col gap-3">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-slate-100 rounded-xl flex items-center justify-center text-slate-600 font-bold"><i class="fa-solid fa-user"></i></div>
                <div class="flex flex-col">
                    <span class="text-slate-900 font-bold text-xs tracking-tight">XPENG SUNTER</span>
                    <span class="text-slate-400 font-medium text-[10px]">AF00115</span>
                </div>
            </div>
            <a href="#" class="text-red-500 font-bold text-[11px] no-underline flex items-center gap-2 px-1 hover:text-red-600 transition-colors"><i class="fa-solid fa-right-from-bracket"></i> Sign Out</a>
        </div>
    </div>

    <!-- 2. MAIN CONTENT AREA SEBELAH KANAN -->
    <div class="main-content pl-[260px] w-full min-h-screen">
        <div class="p-8 max-w-[1400px] mx-auto">
            
            <!-- HALAMAN MASTER -->
            <div id="page-master" class="page-section active">
                <div class="mb-8">
                    <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">MASTER</h1>
                    <div class="flex items-center gap-2 text-slate-400 font-semibold text-[11px] uppercase tracking-wider mt-1">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block animate-pulse"></span> TERMINAL: AF00115
                    </div>
                </div>

                <!-- DISPLAY KARTU UTAMA -->
                <div class="bg-white border border-slate-100 rounded-3xl p-8 shadow-sm min-h-[560px]">
                    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
                        
                        <!-- PANEL BOX KIRI (INVENTORY SEARCH) -->
                        <div class="lg:col-span-5 lg:border-r lg:border-slate-100 lg:pr-8">
                            <div class="flex items-center gap-2 text-slate-900 font-extrabold text-xs tracking-wider uppercase mb-1">
                                <span class="bg-slate-900 text-white text-[10px] px-1.5 py-0.5 rounded">#</span> Inventory Search
                            </div>
                            <p class="text-slate-400 font-medium text-xs mb-6">Input specific part numbers to check current stock availability.</p>

                            <!-- INPUT BOX 10 GRID -->
                            <div class="grid grid-cols-2 gap-3 mb-6">
                                <div><input type="text" class="part-input w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-xs font-semibold text-slate-700 transition-all placeholder-slate-300" placeholder="1  Part Number"></div>
                                <div><input type="text" class="part-input w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-xs font-semibold text-slate-700 transition-all placeholder-slate-300" placeholder="2  Part Number"></div>
                                <div><input type="text" class="part-input w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-xs font-semibold text-slate-700 transition-all placeholder-slate-300" placeholder="3  Part Number"></div>
                                <div><input type="text" class="part-input w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-xs font-semibold text-slate-700 transition-all placeholder-slate-300" placeholder="4  Part Number"></div>
                                <div><input type="text" class="part-input w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-xs font-semibold text-slate-700 transition-all placeholder-slate-300" placeholder="5  Part Number"></div>
                                <div><input type="text" class="part-input w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-xs font-semibold text-slate-700 transition-all placeholder-slate-300" placeholder="6  Part Number"></div>
                                <div><input type="text" class="part-input w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-xs font-semibold text-slate-700 transition-all placeholder-slate-300" placeholder="7  Part Number"></div>
                                <div><input type="text" class="part-input w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-xs font-semibold text-slate-700 transition-all placeholder-slate-300" placeholder="8  Part Number"></div>
                                <div><input type="text" class="part-input w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-xs font-semibold text-slate-700 transition-all placeholder-slate-300" placeholder="9  Part Number"></div>
                                <div><input type="text" class="part-input w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-xs font-semibold text-slate-700 transition-all placeholder-slate-300" placeholder="10 Part Number"></div>
                            </div>

                            <div class="flex items-center gap-3">
                                <button onclick="executeLiveStockQuery()" type="button" class="bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs tracking-wide px-6 py-3 rounded-xl transition-all shadow-sm flex items-center justify-center gap-2"><i class="fa-solid fa-magnifying-glass"></i> Query Stock</button>
