<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Portal Dev - SPK TO DO 2025</title>
    <!-- Memuat framework CSS Bootstrap resmi -->
    <link rel="stylesheet" href="https://jsdelivr.net">
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body { font-family: 'Nunito', sans-serif; background-color: #f8f9fc; margin: 0; padding: 0; }
        .sidebar-container { background: linear-gradient(180deg, #4e73df 10%, #224abe 100%); min-height: 100vh; padding: 1.5rem 1rem; color: #fff; position: fixed; top: 0; left: 0; width: 240px; z-index: 1000; }
        .sidebar-brand { color: #fff; font-weight: 800; font-size: 1.2rem; text-decoration: none; text-transform: uppercase; display: block; text-align: center; margin-bottom: 1.5rem; }
        .sidebar-brand:hover { color: #fff; text-decoration: none; }
        .sidebar-heading { color: rgba(255,255,255,.4); font-size: .75rem; font-weight: 800; text-transform: uppercase; letter-spacing: .1rem; margin-bottom: 0.5rem; }
        .nav-item { margin-bottom: 0.5rem; }
        .nav-link { color: rgba(255,255,255,.8); font-weight: 700; display: block; padding: .6rem .8rem; text-decoration: none; border-radius: 0.35rem; }
        .nav-link:hover { color: #fff; background-color: rgba(255, 255, 255, 0.1); text-decoration: none; }
        .nav-item.active .nav-link { color: #fff; background-color: rgba(255, 255, 255, 0.15); }
        .main-content { margin-left: 240px; padding: 2rem; width: calc(100% - 240px); background-color: #f8f9fc; min-height: 100vh; }
        .topbar { background-color: #fff; height: 4.375rem; margin-bottom: 2rem; box-shadow: 0 .15rem 1.75rem 0 rgba(58,59,69,.15); margin-top: -2rem; margin-left: -2rem; margin-right: -2rem; }
        .card { border: none; border-radius: .35rem; box-shadow: 0 .15rem 1.75rem 0 rgba(58,59,69,.15); background-color: #fff; }
        .card-header { background-color: #f8f9fc; border-bottom: 1px solid #e3e6f0; font-weight: 700; color: #4e73df; }
    </style>
</head>
<body>

    <!-- 1. SIDEBAR MENU SISI KIRI -->
    <div class="sidebar-container">
        <a class="sidebar-brand" href="#"><i class="fas fa-tools mr-2"></i>Part Counter</a>
        <hr class="border-light">
        <div class="sidebar-heading">Menu Utama</div>
        <div class="nav-item active"><a class="nav-link" href="#"><i class="fas fa-search mr-2"></i>Cek Faktur / SPK</a></div>
        <div class="nav-item"><a class="nav-link" href="#" onclick="alert('Halaman Laporan Order sedang disiapkan!')"><i class="fas fa-file-alt mr-2"></i>Laporan Order</a></div>
        <div class="nav-item"><a class="nav-link" href="#" onclick="alert('Halaman Riwayat sedang disiapkan!')"><i class="fas fa-history mr-2"></i>Riwayat Transaksi</a></div>
    </div>

    <!-- 2. KONTEN UTAMA SISI KANAN -->
    <div class="main-content">
        <div class="topbar"></div>
        <div class="container-fluid">
            <h1 class="h3 mb-4 text-gray-800">Sistem Pengecekan SPK <span class="badge badge-primary font-weight-normal text-xs ml-2"><i class="fas fa-sync-alt fa-spin mr-1"></i> Live Auto-Update</span></h1>
            
            <!-- Kotak Pencarian Rapi -->
            <div class="card mb-4 col-lg-9 p-0">
                <div class="card-header py-3"><h6 class="m-0 font-weight-bold text-primary"><i class="fas fa-search mr-1"></i> Cari Data SPK Terkini</h6></div>
                <div class="card-body">
                    <form id="cekForm">
                        <div class="form-group row align-items-center">
                            <label class="col-sm-3 font-weight-bold text-dark mb-0">Nomor SPK</label>
                            <div class="col-sm-9">
                                <input type="text" class="form-control" id="noFaktur" placeholder="Masukkan Nomor SPK (Contoh: X526-0113)" required>
                            </div>
                        </div>
                        <div class="text-right mt-3">
                            <button type="submit" id="btnCari" class="btn btn-primary px-5 shadow-sm">Cari Data</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Kotak Tabel Hasil -->
            <div id="boxHasil" class="card mb-4 col-lg-9 p-0 d-none">
                <div id="headerHasil" class="card-header py-3 text-white"><h6 class="m-0 font-weight-bold">Detail Informasi SPK Ditemukan</h6></div>
                <div class="card-body text-dark" id="konten"></div>
            </div>
        </div>
    </div>

    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>

    <script>
        // TEMPELKAN LINK CSV BARU ANDA YANG DIALURKAN DARI LANGKAH 1 DI BAWAH INI:
        const LINK_CSV_ANDA = "https://google.com";

        function parseCSVLine(text) {
            let p = '', r = []; let q = false;
            for (let i = 0; i < text.length; i++) {
                let c = text[i];
                if (c === '"') { q = !q; }
                else if ((c === ';' || c === ',') && !q) { r.push(p); p = ''; }
                else { p += c; }
            }
            r.push(p); return r;
        }

        document.getElementById('cekForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const inputFaktur = document.getElementById('noFaktur').value.trim().toLowerCase();
            const box = document.getElementById('boxHasil');
            const header = document.getElementById('headerHasil');
            const konten = document.getElementById('konten');
            const btn = document.getElementById('btnCari');

            btn.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i>Mencari...`;
            btn.disabled = true;

            fetch(LINK_CSV_ANDA)
            .then(res => res.text())
            .then(csvText => {
                const lines = csvText.split("\n");
                let dataDitemukan = null;

                // Loop membaca baris data (Melewati baris header)
                for (let i = 3; i < lines.length; i++) {
                    let baris = lines[i].trim();
                    if (!baris) continue;
                    
                    let columns = parseCSVLine(baris);
                    columns = columns.map(col => col.replace(/^"(.*)"$/, '$1').trim());

                    // Membaca Kolom E (indeks 4) sebagai Kolom "NO.SPK" utama database baru Anda
                    if (columns.length > 4) {
                        let noSpkSheet = columns[4].toLowerCase();
                        
                        if (noSpkSheet === inputFaktur) {
                            dataDitemukan = {
                                no: columns[0] || '-',
                                spv: columns[1] || '-',
                                sales: columns[2] || '-',
                                customer: columns[3] || '-',
                                no_spk: columns[4] || '-',
                                tgl_spk: columns[5] || '-',
                                vin: columns[6] || '-',
                                type: columns[7] || '-',
                                ext: columns[8] || '-',
                                int: columns[9] || '-',
                                chs: columns[13] || '-', // Kolom OTR
                                booking: columns[14] || '-' // Kolom Booking
                            };
                            break;
                        }
                    }
                }

                box.classList.remove('d-none');
                btn.innerHTML = `Cari Data`;
                btn.disabled = false;

                if (dataDitemukan) {
                    header.style.backgroundColor = "#28a745"; header.style.color = "#fff";
                    konten.innerHTML = `
                        <table class="table table-bordered text-dark mb-0">
                            <tr><td width="35%"><strong>Nomor SPK</strong></td><td><strong class="text-primary">${dataDitemukan.no_spk}</strong></td></tr>
                            <tr><td><strong>Tanggal SPK</strong></td><td>${dataDitemukan.tgl_spk}</td></tr>
                            <tr><td><strong>Nama Customer</strong></td><td><strong>${dataDitemukan.customer}</strong></td></tr>
                            <tr><td><strong>Nama Sales / SPV</strong></td><td>${dataDitemukan.sales} / ${dataDitemukan.spv}</td></tr>
                            <tr><td><strong>Type Unit Kendaraan</strong></td><td>${dataDitemukan.type}</td></tr>
                            <tr><td><strong>VIN / No. Rangka</strong></td><td>${dataDitemukan.vin}</td></tr>
                            <tr><td><strong>Warna (Ext / Int)</strong></td><td>${dataDitemukan.ext} / ${dataDitemukan.int}</td></tr>
                            <tr><td><strong>Nilai OTR</strong></td><td><strong class="text-success">${dataDitemukan.chs}</strong></td></tr>
                            <tr><td><strong>Booking Fee</strong></td><td>${dataDitemukan.booking}</td></tr>
                        </table>
                    `;
                } else {
                    header.style.backgroundColor = "#6c757d"; header.style.color = "#fff";
                    konten.innerHTML = `<span class="text-danger font-weight-bold"><i class="fas fa-times-circle mr-1"></i> Nomor SPK "${document.getElementById('noFaktur').value}" tidak ditemukan di lembar SPK 2026!</span>`;
                }
            })
            .catch(err => {
