<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Portal Dev - Part Counter</title>
    <!-- Memuat link desain resmi Bootstrap dan FontAwesome via online -->
    <link rel="stylesheet" href="https://jsdelivr.net">
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body { font-family: 'Nunito', sans-serif; background-color: #f8f9fc; margin: 0; padding: 0; }
        .sidebar-container { background: linear-gradient(180deg, #4e73df 10%, #224abe 100%); min-height: 100vh; padding: 1.5rem 1rem; color: #fff; position: fixed; top: 0; left: 0; width: 240px; z-index: 1000; }
        .sidebar-brand { color: #fff; font-weight: 800; font-size: 1.2rem; text-decoration: none; text-transform: uppercase; display: block; text-align: center; margin-bottom: 1.5rem; }
        .sidebar-brand:hover { color: #fff; text-decoration: none; }
        .sidebar-heading { color: rgba(255,255,255,.4); font-size: .75rem; font-weight: 800; text-transform: uppercase; letter-spacing: .1rem; margin-bottom: 0.5rem; }
        .nav-item { margin-bottom: 0.5rem; }
        .nav-link { color: rgba(255,255,255,.8); font-weight: 700; display: block; padding: .6rem .8rem; text-decoration: none; border-radius: 0.35rem; }
        .nav-link:hover { color: #fff; background-color: rgba(255, 255, 255, 0.1); text-decoration: none; }
        .nav-item.active .nav-link { color: #fff; background-color: rgba(255, 255, 255, 0.15); }
        .main-content { margin-left: 240px; padding: 2rem; width: calc(100% - 240px); background-color: #f8f9fc; min-height: 100vh; }
        .topbar { background-color: #fff; height: 4.375rem; margin-bottom: 2rem; box-shadow: 0 .15rem 1.75rem 0 rgba(58,59,69,.15); margin-top: -2rem; margin-left: -2rem; margin-right: -2rem; }
        .card { border: none; border-radius: .35rem; box-shadow: 0 .15rem 1.75rem 0 rgba(58,59,69,.15); background-color: #fff; }
        .card-header { background-color: #f8f9fc; border-bottom: 1px solid #e3e6f0; font-weight: 700; color: #4e73df; }
    </style>
</head>
<body>

    <!-- 1. SIDEBAR MENU SISI KIRI (SUDAH DITAMBAH MENU BARU DI BAWAH CEK FAKTUR) -->
    <div class="sidebar-container">
        <a class="sidebar-brand" href="#"><i class="fas fa-tools mr-2"></i>Part Counter</a>
        <hr class="border-light">
        
        <div class="sidebar-heading">Menu Utama</div>
        <!-- Kolom Menu 1: Cek Faktur (Aktif) -->
        <div class="nav-item active">
            <a class="nav-link" href="#"><i class="fas fa-search mr-2"></i>Cek Faktur</a>
        </div>
        
        <!-- Kolom Menu 2: SPK TO DO 2025 (Baru - Sesuai Nama File Gambar Anda) -->
        <div class="nav-item">
            <a class="nav-link" href="#" onclick="alert('Halaman SPK TO DO sedang disiapkan!')"><i class="fas fa-clipboard-list mr-2"></i>SPK TO DO 2025</a>
        </div>
        
        <!-- Kolom Menu 3: Laporan Order Sparepart (Baru) -->
        <div class="nav-item">
            <a class="nav-link" href="#" onclick="alert('Halaman Laporan Order sedang disiapkan!')"><i class="fas fa-file-invoice mr-2"></i>Laporan Order</a>
        </div>
        
        <!-- Kolom Menu 4: Riwayat Transaksi (Baru) -->
        <div class="nav-item">
            <a class="nav-link" href="#" onclick="alert('Halaman Riwayat sedang disiapkan!')"><i class="fas fa-history mr-2"></i>Riwayat Transaksi</a>
        </div>
    </div>

    <!-- 2. AREA KONTEN UTAMA SISI KANAN -->
    <div class="main-content">
        <div class="topbar"></div>
        <div class="container-fluid">
            <h1 class="h3 mb-4 text-gray-800">Sistem Pengecekan Faktur / SPK <span class="badge badge-primary font-weight-normal text-xs ml-2"><i class="fas fa-sync-alt fa-spin mr-1"></i> Live Auto-Update</span></h1>
            
            <!-- Kotak Formulir Input Pencarian -->
            <div class="card mb-4 col-lg-9 p-0">
                <div class="card-header py-3"><h6 class="m-0 font-weight-bold text-primary"><i class="fas fa-search mr-1"></i> Cari Data SPK / Faktur Terkini</h6></div>
                <div class="card-body">
                    <form id="cekForm">
                        <div class="form-group row align-items-center">
                            <label class="col-sm-3 font-weight-bold text-dark mb-0">Nomor SPK / JO</label>
                            <div class="col-sm-9">
                                <input type="text" class="form-control" id="noFaktur" placeholder="Contoh: X526-0113" required>
                            </div>
                        </div>
                        <div class="text-right mt-3">
                            <button type="submit" id="btnCari" class="btn btn-primary px-5 shadow-sm">Cari Data</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Kotak Tabel Hasil Pengecekan -->
            <div id="boxHasil" class="card mb-4 col-lg-9 p-0 d-none">
                <div id="headerHasil" class="card-header py-3 text-white"><h6 class="m-0 font-weight-bold">Detail Data SPK Ditemukan</h6></div>
                <div class="card-body text-dark" id="konten"></div>
            </div>
        </div>
    </div>

    <!-- Library JavaScript Pendukung -->
    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>

    <script>
        // Link CSV Google Sheets Anda yang mengarah ke data "SPK 2026"
        const LINK_CSV_ANDA = "https://google.com";

        function parseCSVLine(text) {
            let p = '', r = []; let q = false;
            for (let i = 0; i < text.length; i++) {
                let c = text[i];
                if (c === '"') { q = !q; }
                else if ((c === ';' || c === ',') && !q) { r.push(p); p = ''; }
                else { p += c; }
            }
            r.push(p); return r;
        }

        document.getElementById('cekForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Mengunci agar halaman tidak me-refresh otomatis
            
            const inputFaktur = document.getElementById('noFaktur').value.trim().toLowerCase();
            const box = document.getElementById('boxHasil');
            const header = document.getElementById('headerHasil');
            const konten = document.getElementById('konten');
            const btn = document.getElementById('btnCari');

            if (!inputFaktur) return;

            btn.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i>Mencari...`;
            btn.disabled = true;

            fetch(LINK_CSV_ANDA)
            .then(res => res.text())
            .then(csvText => {
                const lines = csvText.split("\n");
                let dataDitemukan = null;

                // Loop membaca baris data (Mulai dari indeks ke-3 untuk melewati header)
                for (let i = 3; i < lines.length; i++) {
                    let baris = lines[i].trim();
                    if (!baris) continue;
                    
                    let columns = parseCSVLine(baris);
                    columns = columns.map(col => col.replace(/^"(.*)"$/, '$1').trim());

                    // Berdasarkan Foto Google Sheets Anda: Kolom NO.SPK ada di Kolom ke-4 (indeks 3)
                    if (columns.length > 3) {
                        let noSpkSheet = columns[3].toLowerCase();
                        
                        if (noSpkSheet === inputFaktur) {
                            dataDitemukan = {
                                sales: columns[2] || '-',
                                customer: columns[1] || '-',
                                no_spk: columns[3] || '-',
                                tgl_spk: columns[4] || '-',
                                vin: columns[5] || '-',
                                type: columns[6] || '-',
                                exterior: columns[7] || '-',
                                interior: columns[8] || '-',
                                nogin: columns[9] || '-',
                                noka: columns[10] || '-',
                                source: columns[11] || '-',
                                otr: columns[14] || 'Rp 0'
                            };
                            break;
                        }
                    }
                }

                box.classList.remove('d-none');
                btn.innerHTML = `Cari Data`;
                btn.disabled = false;

                if (dataDitemukan) {
                    header.style.backgroundColor = "#28a745"; // Warna Hijau Sukses
                    header.style.color = "#fff";

                    konten.innerHTML = `
                        <table class="table table-bordered text-dark mb-0">
                            <tr><td width="35%"><strong>No. SPK / Kwitansi</strong></td><td><strong class="text-primary">${dataDitemukan.no_spk}</strong></td></tr>
                            <tr><td><strong>Tanggal SPK</strong></td><td>${dataDitemukan.tgl_spk}</td></tr>
                            <tr><td><strong>Nama Customer</strong></td><td><strong>${dataDitemukan.customer}</strong></td></tr>
                            <tr><td><strong>Nama Sales</strong></td><td>${dataDitemukan.sales}</td></tr>
                            <tr><td><strong>Type Unit</strong></td><td>${dataDitemukan.type}</td></tr>
                            <tr><td><strong>VIN No. / Noka</strong></td><td>${dataDitemukan.vin} / ${dataDitemukan.noka}</td></tr>
