<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Portal Dev - Cek Faktur Terkini</title>
    <link href="https://cloudflare.com" rel="stylesheet" type="text/css">
    <link href="https://googleapis.com" rel="stylesheet">
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body id="page-top">
    <div id="wrapper">
        <ul class="navbar-nav bg-gradient-primary sidebar sidebar-dark accordion" id="accordionSidebar">
            <a class="sidebar-brand d-flex align-items-center justify-content-center" href="#">
                <div class="sidebar-brand-icon rotate-n-15"><i class="fas fa-tools"></i></div>
                <div class="sidebar-brand-text mx-3">Part Counter</div>
            </a>
            <hr class="sidebar-divider my-0">
            <div class="sidebar-heading mt-3">Menu Utama</div>
            <li class="nav-item active"><a class="nav-link" href="#"><i class="fas fa-search"></i> <span>Cek Faktur Transaksi</span></a></li>
        </ul>

        <div id="content-wrapper" class="d-flex flex-column">
            <div id="content">
                <nav class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow"></nav>
                <div class="container-fluid">
                    <h1 class="h3 mb-4 text-gray-800">Sistem Pengecekan Faktur <span class="badge badge-primary text-xs font-weight-normal"><i class="fas fa-sync-alt fa-spin mr-1"></i> Live Auto-Update</span></h1>
                    
                    <div class="card shadow mb-4 col-lg-8 p-0">
                        <div class="card-header py-3"><h6 class="m-0 font-weight-bold text-primary">Cari Data Faktur Terkini</h6></div>
                        <div class="card-body">
                            <form id="cekForm">
                                <div class="form-group row">
                                    <label class="col-sm-3 font-weight-bold text-dark">Nomor Faktur</label>
                                    <div class="col-sm-9">
                                        <input type="text" class="form-control" id="noFaktur" placeholder="Masukkan nomor faktur..." required>
                                    </div>
                                </div>
                                <div class="text-right">
                                    <button type="submit" id="btnCari" class="btn btn-primary px-5 shadow-sm">Cari Data</button>
                                </div>
                            </form>
                        </div>
                    </div>

                    <div id="boxHasil" class="card shadow mb-4 col-lg-8 p-0 d-none">
                        <div id="headerHasil" class="card-header py-3 text-white"><h6 class="m-0 font-weight-bold">Detail Data Ditemukan</h6></div>
                        <div class="card-body text-dark" id="konten"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cloudflare.com"></script>
    <script src="https://cloudflare.com"></script>

    <script>
        const LINK_CSV_ANDA = "https://google.com";

        function parseCSVLine(text) {
            let p = '', r = [];
            let q = false;
            for (let i = 0; i < text.length; i++) {
                let c = text[i];
                if (c === '"') { q = !q; }
                else if (c === ',' && !q) { r.push(p); p = ''; }
                else { p += c; }
            }
            r.push(p);
            return r;
        }

        document.getElementById('cekForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const inputFaktur = document.getElementById('noFaktur').value.trim().toLowerCase();
            const box = document.getElementById('boxHasil');
            const header = document.getElementById('headerHasil');
            const konten = document.getElementById('konten');
            const btn = document.getElementById('btnCari');

            btn.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i>Mencari...`;
            btn.disabled = true;

            fetch(LINK_CSV_ANDA)
            .then(res => res.text())
            .then(csvText => {
                const lines = csvText.split("\n");
                let dataDitemukan = null;

                for (let i = 3; i < lines.length; i++) {
                    if (!lines[i].trim()) continue;
                    
                    const columns = parseCSVLine(lines[i]);
                    
                    if (columns.length > 3 && columns[3]) {
                        const noFakturSheet = columns[3].trim().toLowerCase();
                        
                        if (noFakturSheet === inputFaktur) {
                            dataDitemukan = {
                                tanggal: columns[0] ? columns[0].trim() : '-',
                                customer: columns[1] ? columns[1].trim() : '-',
                                no_faktur: columns[3] ? columns[3].trim() : '-',
                                vin: columns[4] ? columns[4].trim() : '-',
                                nama_part: columns[5] ? columns[5].trim() : '-',
                                total: columns[9] ? columns[9].trim() : '0',
                                status: columns[11] ? columns[11].trim().toUpperCase() : 'BELUM BAYAR'
                            };
                            break;
                        }
                    }
                }

                box.classList.remove('d-none');
                btn.innerHTML = `Cari Data`;
                btn.disabled = false;

                if (dataDitemukan) {
                    let badgeColor = "bg-secondary";
                    if(dataDitemukan.status.includes("LUNAS")) {
                        header.className = "card-header py-3 bg-success text-white";
                        badgeColor = "badge-success";
                    } else {
                        header.className = "card-header py-3 bg-danger text-white";
                        badgeColor = "badge-danger";
                    }

                    konten.innerHTML = `
                        <table class="table table-bordered text-dark mb-0">
                            <tr><td width="35%"><strong>Tanggal Faktur</strong></td><td>${dataDitemukan.tanggal}</td></tr>
                            <tr><td><strong>Nama Customer</strong></td><td>${dataDitemukan.customer}</td></tr>
                            <tr><td><strong>VIN</strong></td><td>${dataDitemukan.vin}</td></tr>
                            <tr><td><strong>Nama Part / Jasa</strong></td><td>${dataDitemukan.nama_part}</td></tr>
                            <tr><td><strong>Total Harga</strong></td><td>Rp ${dataDitemukan.total}</td></tr>
                            <tr><td><strong>Status Pembayaran</strong></td><td><span class="badge ${badgeColor}">${dataDitemukan.status}</span></td></tr>
                        </table>
                    `;
                } else {
                    header.className = "card-header py-3 bg-secondary text-white";
                    konten.innerHTML = `<span class="text-danger font-weight-bold"><i class="fas fa-times-circle mr-1"></i> Nomor Faktur "${document.getElementById('noFaktur').value}" tidak ditemukan di Google Sheets!</span>`;
                }
            })
            .catch(err => {
                btn.innerHTML = `Cari Data`;
                btn.disabled = false;
                box.classList.remove('d-none');
                header.className = "card-header py-3 bg-dark text-white";
                konten.innerHTML = `<span class="text-danger font-weight-bold"><i class="fas fa-exclamation-triangle mr-1"></i> Terjadi kesalahan memuat basis data online.</span>`;
            });
        });
    </script>
</body>
</html>
