<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Portal Dev - Cek Faktur Terkini</title>
    <!-- Memuat link desain alternatif resmi via internet -->
    <link rel="stylesheet" href="https://jsdelivr.net">
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body { font-family: 'Nunito', sans-serif; background-color: #f8f9fc; margin: 0; padding: 0; }
        .sidebar-container { background: linear-gradient(180deg, #4e73df 10%, #224abe 100%); min-height: 100vh; padding: 1.5rem 1rem; color: #fff; position: fixed; top: 0; left: 0; width: 220px; z-index: 1000; }
        .sidebar-brand { color: #fff; font-weight: 800; font-size: 1.2rem; text-decoration: none; text-transform: uppercase; display: block; text-align: center; margin-bottom: 1.5rem; }
        .sidebar-brand:hover { color: #fff; text-decoration: none; }
        .sidebar-heading { color: rgba(255,255,255,.4); font-size: .75rem; font-weight: 800; text-transform: uppercase; letter-spacing: .1rem; margin-bottom: 0.5rem; }
        .nav-link { color: rgba(255,255,255,.8); font-weight: 700; display: block; padding: .5rem 0; text-decoration: none; }
        .nav-link:hover, .nav-item.active .nav-link { color: #fff; text-decoration: none; }
        .main-content { margin-left: 220px; padding: 2rem; width: calc(100% - 220px); background-color: #f8f9fc; min-height: 100vh; }
        .topbar { background-color: #fff; height: 4.375rem; margin-bottom: 2rem; box-shadow: 0 .15rem 1.75rem 0 rgba(58,59,69,.15); margin-top: -2rem; margin-left: -2rem; margin-right: -2rem; }
        .card { border: none; border-radius: .35rem; box-shadow: 0 .15rem 1.75rem 0 rgba(58,59,69,.15); background-color: #fff; }
        .card-header { background-color: #f8f9fc; border-bottom: 1px solid #e3e6f0; font-weight: 700; color: #4e73df; }
    </style>
</head>
<body>

    <!-- 1. SIDEBAR MENU SISI KIRI -->
    <div class="sidebar-container">
        <a class="sidebar-brand" href="#"><i class="fas fa-tools mr-2"></i>Part Counter</a>
        <hr class="border-light">
        <div class="sidebar-heading">Menu Utama</div>
        <div class="nav-item active">
            <a class="nav-link" href="#"><i class="fas fa-search mr-2"></i>Cek Faktur</a>
        </div>
    </div>

    <!-- 2. KONTEN UTAMA SISI KANAN -->
    <div class="main-content">
        <div class="topbar"></div>
        <div class="container-fluid">
            <h1 class="h3 mb-4 text-gray-800">Sistem Pengecekan Faktur <span class="badge badge-primary font-weight-normal text-xs ml-2"><i class="fas fa-sync-alt fa-spin mr-1"></i> Live Auto-Update</span></h1>
            
            <!-- Kotak Formulir Input Tebal & Modern -->
            <div class="card mb-4 col-lg-9 p-0">
                <div class="card-header py-3"><h6 class="m-0 font-weight-bold text-primary"><i class="fas fa-search mr-1"></i> Cari Data Faktur Terkini</h6></div>
                <div class="card-body">
                    <form id="cekForm">
                        <div class="form-group row align-items-center">
                            <label class="col-sm-3 font-weight-bold text-dark mb-0">Nomor Faktur / JO</label>
                            <div class="col-sm-9">
                                <input type="text" class="form-control" id="noFaktur" placeholder="Contoh: M/O/043/K/IAG/070226" required>
                            </div>
                        </div>
                        <div class="text-right mt-3">
                            <button type="submit" id="btnCari" class="btn btn-primary px-5 shadow-sm">Cari Data</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Kotak Tabel Hasil Pencarian -->
            <div id="boxHasil" class="card mb-4 col-lg-9 p-0 d-none">
                <div id="headerHasil" class="card-header py-3 text-white"><h6 class="m-0 font-weight-bold" id="judulHasil">Detail Data Ditemukan</h6></div>
                <div class="card-body text-dark" id="konten"></div>
            </div>
        </div>
    </div>

    <!-- Memuat Library Pendukung JavaScript -->
    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>

    <script>
        const LINK_CSV_ANDA = "https://google.com";

        function parseCSVLine(text) {
            let p = '', r = []; let q = false;
            for (let i = 0; i < text.length; i++) {
                let c = text[i];
                if (c === '"') { q = !q; }
                else if ((c === ';' || c === ',') && !q) { r.push(p); p = ''; }
                else { p += c; }
            }
            r.push(p); return r;
        }

        document.getElementById('cekForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const inputFaktur = document.getElementById('noFaktur').value.trim().toLowerCase();
            const box = document.getElementById('boxHasil');
            const header = document.getElementById('headerHasil');
            const konten = document.getElementById('konten');
            const btn = document.getElementById('btnCari');

            btn.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i>Mencari...`;
            btn.disabled = true;

            fetch(LINK_CSV_ANDA)
            .then(res => res.text())
            .then(csvText => {
                const lines = csvText.split("\n");
                let dataDitemukan = null;

                // Membaca baris data (Dimulai dari baris ke-4 atau indeks 3 melewati judul spreadsheet)
                for (let i = 3; i < lines.length; i++) {
                    if (!lines[i].trim()) continue;
                    
                    const columns = parseCSVLine(lines[i]);
                    
                    // Kolom ke-4 (indeks 3) adalah kolom "No Faktur" asli pada spreadsheet Anda
                    if (columns.length > 3 && columns[3]) {
                        const noFakturSheet = columns[3].replace(/^"(.*)"$/, '$1').trim().toLowerCase();
                        
                        if (noFakturSheet === inputFaktur) {
                            dataDitemukan = {
                                tanggal: columns[1] ? columns[1].replace(/^"(.*)"$/, '$1').trim() : '-',
                                customer: columns[2] ? columns[2].replace(/^"(.*)"$/, '$1').trim() : '-',
                                no_faktur: columns[3] ? columns[3].replace(/^"(.*)"$/, '$1').trim() : '-',
                                vin: columns[4] ? columns[4].replace(/^"(.*)"$/, '$1').trim() : '-',
                                type: columns[5] ? columns[5].replace(/^"(.*)"$/, '$1').trim() : '-',
                                kode_part: columns[6] ? columns[6].replace(/^"(.*)"$/, '$1').trim() : '-',
                                nama_part: columns[7] ? columns[7].replace(/^"(.*)"$/, '$1').trim() : '-',
                                total: columns[12] ? columns[12].replace(/^"(.*)"$/, '$1').trim() : '0',
                                status: columns[14] ? columns[14].replace(/^"(.*)"$/, '$1').trim().toUpperCase() : 'BELUM BAYAR'
                            };
                            break;
                        }
                    }
                }

                box.classList.remove('d-none');
                btn.innerHTML = `Cari Data`;
                btn.disabled = false;

                if (dataDitemukan) {
                    let badgeColor = "badge-secondary";
                    // Penentuan warna status berdasarkan isi teks database
                    if (dataDitemukan.status.includes("LUNAS")) {
                        header.style.backgroundColor = "#28a745"; header.style.color = "#fff";
                        badgeColor = "badge-success";
                    } else {
                        header.style.backgroundColor = "#dc3545"; header.style.color = "#fff";
                        badgeColor = "badge-danger";
                    }

                    konten.innerHTML = `
                        <table class="table table-bordered text-dark mb-0">
                            <tr><td width="35%"><strong>Tanggal Faktur</strong></td><td>${dataDitemukan.tanggal}</td></tr>
                            <tr><td><strong>No. Job Order / Faktur</strong></td><td><strong class="text-primary">${dataDitemukan.no_faktur}</strong></td></tr>
                            <tr><td><strong>Nama Customer</strong></td><td>${dataDitemukan.customer}</td></tr>
                            <tr><td><strong>VIN No.</strong></td><td>${dataDitemukan.vin}</td></tr>
                            <tr><td><strong>Type Unit</strong></td><td>${dataDitemukan.type}</td></tr>
                            <tr><td><strong>Kode Part</strong></td><td>${dataDitemukan.kode_part}</td></tr>
                            <tr><td><strong>Nama Part / Jasa</strong></td><td>${dataDitemukan.nama_part}</td></tr>
                            <tr><td><strong>Total Tagihan</strong></td><td><strong>Rp ${dataDitemukan.total}</strong></td></tr>
                            <tr><td><strong>Status Pembayaran</strong></td><td><span class="badge ${badgeColor} p-2 text-uppercase">${dataDitemukan.status}</span></td></tr>
                        </table>
                    `;
                } else {
                    header.style.backgroundColor = "#6c757d"; header.style.color = "#fff";
