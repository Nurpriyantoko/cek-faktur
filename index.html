<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Portal Dev - Cek Faktur Terkini</title>
    <!-- Desain mandiri alternatif yang dijamin lolos keamanan browser dan GitHub Pages -->
    <link rel="stylesheet" href="https://jsdelivr.net">
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body { font-family: 'Nunito', sans-serif; background-color: #f8f9fc; }
        .sidebar { background: linear-gradient(180deg, #4e73df 10%, #224abe 100%); min-height: 100vh; padding: 1.5rem 1rem; }
        .sidebar-brand { color: #fff; font-weight: 800; font-size: 1.2rem; text-decoration: none; text-transform: uppercase; display: block; text-align: center; margin-bottom: 1.5rem; }
        .sidebar-heading { color: rgba(255,255,255,.4); font-size: .75rem; font-weight: 800; text-transform: uppercase; letter-spacing: .1rem; }
        .nav-link { color: rgba(255,255,255,.8); font-weight: 700; display: block; padding: .5rem 0; text-decoration: none; }
        .nav-link:hover, .nav-item.active .nav-link { color: #fff; }
        .topbar { background-color: #fff; height: 4.375rem; margin-bottom: 1.5rem; box-shadow: 0 .15rem 1.75rem 0 rgba(58,59,69,.15); }
        .card { border: none; border-radius: .35rem; box-shadow: 0 .15rem 1.75rem 0 rgba(58,59,69,.15); }
        .card-header { background-color: #f8f9fc; border-bottom: 1px solid #e3e6f0; font-weight: 700; color: #4e73df; }
    </style>
</head>
<body>
    <div class="d-flex">
        <!-- Sidebar Menu -->
        <div class="sidebar col-md-2 d-none d-md-block">
            <a class="sidebar-brand" href="#"><i class="fas fa-tools mr-2"></i>Part Counter</a>
            <hr class="border-light">
            <div class="sidebar-heading">Menu Utama</div>
            <div class="nav-item active"><a class="nav-link" href="#"><i class="fas fa-search mr-2"></i>Cek Faktur</a></div>
        </div>

        <!-- Konten Utama -->
        <div class="flex-grow-1">
            <div class="topbar"></div>
            <div class="container-fluid">
                <h1 class="h3 mb-4 text-gray-800">Sistem Pengecekan Faktur <span class="badge badge-primary font-weight-normal text-xs"><i class="fas fa-sync-alt fa-spin mr-1"></i> Live Auto-Update</span></h1>
                
                <!-- Form Pencarian -->
                <div class="card mb-4 col-lg-8 p-0">
                    <div class="card-header py-3">Cari Data Faktur Terkini</div>
                    <div class="card-body">
                        <form id="cekForm">
                            <div class="form-group row">
                                <label class="col-sm-3 font-weight-bold text-dark">Nomor Faktur</label>
                                <div class="col-sm-9">
                                    <input type="text" class="form-control" id="noFaktur" placeholder="Masukkan nomor faktur..." required>
                                </div>
                            </div>
                            <div class="text-right">
                                <button type="submit" id="btnCari" class="btn btn-primary px-5 shadow-sm">Cari Data</button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Kotak Hasil -->
                <div id="boxHasil" class="card mb-4 col-lg-8 p-0 d-none">
                    <div id="headerHasil" class="card-header py-3 text-white">Detail Data Ditemukan</div>
                    <div class="card-body text-dark" id="konten"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>

    <script>
        const LINK_CSV_ANDA = "https://google.com";

        function parseCSVLine(text) {
            let p = '', r = []; let q = false;
            for (let i = 0; i < text.length; i++) {
                let c = text[i];
                if (c === '"') { q = !q; }
                else if (c === ',' && !q) { r.push(p); p = ''; }
                else { p += c; }
            }
            r.push(p); return r;
        }

        document.getElementById('cekForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const inputFaktur = document.getElementById('noFaktur').value.trim().toLowerCase();
            const box = document.getElementById('boxHasil');
            const header = document.getElementById('headerHasil');
            const konten = document.getElementById('konten');
            const btn = document.getElementById('btnCari');

            btn.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i>Mencari...`;
            btn.disabled = true;

            fetch(LINK_CSV_ANDA)
            .then(res => res.text())
            .then(csvText => {
                const lines = csvText.split("\n");
                let dataDitemukan = null;

                for (let i = 3; i < lines.length; i++) {
                    if (!lines[i].trim()) continue;
                    const columns = parseCSVLine(lines[i]);
                    if (columns.length > 3 && columns) {
                        const noFakturSheet = columns.trim().toLowerCase();
                        if (noFakturSheet === inputFaktur) {
                            dataDitemukan = {
                                tanggal: columns ? columns.trim() : '-',
                                customer: columns ? columns.trim() : '-',
                                no_faktur: columns ? columns.trim() : '-',
                                vin: columns ? columns.trim() : '-',
                                nama_part: columns ? columns.trim() : '-',
                                total: columns ? columns.trim() : '0',
                                status: columns ? columns.trim().toUpperCase() : 'BELUM BAYAR'
                            };
                            break;
                        }
                    }
                }

                box.classList.remove('d-none');
                btn.innerHTML = `Cari Data`;
                btn.disabled = false;

                if (dataDitemukan) {
                    let badgeColor = "badge-secondary";
                    if(dataDitemukan.status.includes("LUNAS")) {
                        header.style.backgroundColor = "#28a745"; header.style.color = "#fff";
                        badgeColor = "badge-success";
                    } else {
                        header.style.backgroundColor = "#dc3545"; header.style.color = "#fff";
                        badgeColor = "badge-danger";
                    }

                    konten.innerHTML = `
                        <table class="table table-bordered text-dark mb-0">
                            <tr><td width="35%"><strong>Tanggal Faktur</strong></td><td>${dataDitemukan.tanggal}</td></tr>
                            <tr><td><strong>Nama Customer</strong></td><td>${dataDitemukan.customer}</td></tr>
                            <tr><td><strong>VIN</strong></td><td>${dataDitemukan.vin}</td></tr>
                            <tr><td><strong>Nama Part / Jasa</strong></td><td>${dataDitemukan.nama_part}</td></tr>
                            <tr><td><strong>Total Harga</strong></td><td>Rp ${dataDitemukan.total}</td></tr>
                            <tr><td><strong>Status Pembayaran</strong></td><td><span class="badge ${badgeColor}">${dataDitemukan.status}</span></td></tr>
                        </table>
                    `;
                } else {
                    header.style.backgroundColor = "#6c757d"; header.style.color = "#fff";
                    konten.innerHTML = `<span class="text-danger font-weight-bold"><i class="fas fa-times-circle mr-1"></i> Nomor Faktur "${document.getElementById('noFaktur').value}" tidak ditemukan di Google Sheets!</span>`;
                }
            })
            .catch(err => {
                btn.innerHTML = `Cari Data`; btn.disabled = false; box.classList.remove('d-none');
                header.style.backgroundColor = "#343a40"; header.style.color = "#fff";
                konten.innerHTML = `<span class="text-danger font-weight-bold"><i class="fas fa-exclamation-triangle mr-1"></i> Terjadi kesalahan memuat data.</span>`;
            });
        });
    </script>
</body>
</html>
