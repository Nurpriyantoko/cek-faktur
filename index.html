        <script>
            window.addEventListener('DOMContentLoaded', () => {
                // Menunggu inisialisasi render visual selesai 1.5 detik
                setTimeout(() => {
                    const buttons = document.querySelectorAll('button');
                    let queryBtn = null;
                    let resetBtn = null;

                    buttons.forEach(btn => {
                        if (btn.innerText.toLowerCase().includes('query')) { queryBtn = btn; }
                        if (btn.innerText.toLowerCase().includes('reset')) { resetBtn = btn; }
                    });

                    // Mengamankan pemicu agar kebal refresh halaman otomatis
                    if (queryBtn) {
                        queryBtn.type = "button"; 
                        queryBtn.addEventListener('click', (e) => {
                            e.preventDefault();
                            executeLiveStockSystem();
                        });
                    }

                    if (resetBtn) {
                        resetBtn.type = "button";
                        resetBtn.addEventListener('click', () => {
                            document.querySelectorAll('input').forEach(inp => inp.value = '');
                            resetOutputDisplayCard();
                        });
                    }
                }, 1500); 
            });
